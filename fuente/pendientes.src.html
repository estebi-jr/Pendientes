<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendientes</title>
<!--WEB-HEAD-->
<script>try{var t=JSON.parse(localStorage.getItem('pendientes:theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-app-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat:wght@500..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}

/* ---------- Tokens: claro ---------- */
:root{
  color-scheme:light;
  --bg:#F2F5FC; --paper:#FFFFFF; --paper-2:#E9EFFB;
  --ink:#0B1A45; --ink-2:#4F5E88; --ink-3:#8A95B5; --line:#DFE6F4;
  --blue:#1C4ED8; --blue-soft:#E3EBFF; --on-blue:#FFFFFF;
  --late:#D2343A; --soon:#B8520A;
  --pi1:#BFE1FF; --pi2:#C4EFCC; --pi3:#FFEE9E; --pi4:#FFCDE0;
  --pi1-e:#93C8F3; --pi2-e:#94D9A6; --pi3-e:#EDD563; --pi4-e:#F2A5C3;
  --note-ink:#16307F; --note-late:#B3121B;
  --note-shadow:0 1px 1px rgba(16,34,90,.10),0 10px 18px -8px rgba(16,34,90,.38);
  --hdr:rgba(242,245,252,.86); --tabbar:rgba(255,255,255,.88); --scrim:rgba(8,20,60,.30);
  --toast-bg:#0B1A45; --toast-ink:#FFFFFF; --toast-act:#9CC8FF;
  --tint:24%; --cal-mix:58%; --tape:rgba(255,255,255,.6);
  --swipe-alt:#4F5E88; --spk-top:#2A3763; --spk-side:#141C38; --spk-rim:rgba(255,255,255,.14); --metal-hi:#EEF1F8; --metal-lo:#8A94B0; --spk-shadow:rgba(11,26,69,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#070C1C; --paper:#0F1731; --paper-2:#172241;
    --ink:#E6ECFF; --ink-2:#9AA8D0; --ink-3:#66759F; --line:#1E2B50;
    --blue:#7098FF; --blue-soft:#18275A; --on-blue:#07122F;
    --late:#FF6B70; --soon:#FFA15A;
    --pi1:#A9D2F5; --pi2:#AEDFB8; --pi3:#EFDD8A; --pi4:#EFB9CD;
    --pi1-e:#7FB4E3; --pi2-e:#80C394; --pi3-e:#D4BE5B; --pi4-e:#D98FAC;
    --note-ink:#132B6B; --note-late:#A3101A;
    --note-shadow:0 1px 1px rgba(0,0,0,.45),0 12px 22px -10px rgba(0,0,0,.85);
    --hdr:rgba(7,12,28,.84); --tabbar:rgba(15,23,49,.88); --scrim:rgba(0,0,0,.58);
    --toast-bg:#E6ECFF; --toast-ink:#07122F; --toast-act:#1C4ED8;
    --tint:16%; --cal-mix:46%; --tape:rgba(255,255,255,.38);
  --swipe-alt:#33426E; --spk-top:#34436F; --spk-side:#1B2548; --spk-rim:rgba(255,255,255,.18); --metal-hi:#DDE3F0; --metal-lo:#6E7899; --spk-shadow:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#070C1C; --paper:#0F1731; --paper-2:#172241;
  --ink:#E6ECFF; --ink-2:#9AA8D0; --ink-3:#66759F; --line:#1E2B50;
  --blue:#7098FF; --blue-soft:#18275A; --on-blue:#07122F;
  --late:#FF6B70; --soon:#FFA15A;
  --pi1:#A9D2F5; --pi2:#AEDFB8; --pi3:#EFDD8A; --pi4:#EFB9CD;
  --pi1-e:#7FB4E3; --pi2-e:#80C394; --pi3-e:#D4BE5B; --pi4-e:#D98FAC;
  --note-ink:#132B6B; --note-late:#A3101A;
  --note-shadow:0 1px 1px rgba(0,0,0,.45),0 12px 22px -10px rgba(0,0,0,.85);
  --hdr:rgba(7,12,28,.84); --tabbar:rgba(15,23,49,.88); --scrim:rgba(0,0,0,.58);
  --toast-bg:#E6ECFF; --toast-ink:#07122F; --toast-act:#1C4ED8;
  --tint:16%; --cal-mix:46%; --tape:rgba(255,255,255,.38);
  --swipe-alt:#33426E; --spk-top:#34436F; --spk-side:#1B2548; --spk-rim:rgba(255,255,255,.18); --metal-hi:#DDE3F0; --metal-lo:#6E7899; --spk-shadow:rgba(0,0,0,.35);
}
/* Tema elegido dentro de la app (gana sobre el del visor) */
html:root[data-app-theme="light"]{
  color-scheme:light;
  --bg:#F2F5FC; --paper:#FFFFFF; --paper-2:#E9EFFB;
  --ink:#0B1A45; --ink-2:#4F5E88; --ink-3:#8A95B5; --line:#DFE6F4;
  --blue:#1C4ED8; --blue-soft:#E3EBFF; --on-blue:#FFFFFF;
  --late:#D2343A; --soon:#B8520A;
  --pi1:#BFE1FF; --pi2:#C4EFCC; --pi3:#FFEE9E; --pi4:#FFCDE0;
  --pi1-e:#93C8F3; --pi2-e:#94D9A6; --pi3-e:#EDD563; --pi4-e:#F2A5C3;
  --note-ink:#16307F; --note-late:#B3121B;
  --note-shadow:0 1px 1px rgba(16,34,90,.10),0 10px 18px -8px rgba(16,34,90,.38);
  --hdr:rgba(242,245,252,.86); --tabbar:rgba(255,255,255,.88); --scrim:rgba(8,20,60,.30);
  --toast-bg:#0B1A45; --toast-ink:#FFFFFF; --toast-act:#9CC8FF;
  --tint:24%; --cal-mix:58%; --tape:rgba(255,255,255,.6);
  --swipe-alt:#4F5E88; --spk-top:#2A3763; --spk-side:#141C38; --spk-rim:rgba(255,255,255,.14); --metal-hi:#EEF1F8; --metal-lo:#8A94B0; --spk-shadow:rgba(11,26,69,.18);
}
html:root[data-app-theme="dark"]{
  color-scheme:dark;
  --bg:#070C1C; --paper:#0F1731; --paper-2:#172241;
  --ink:#E6ECFF; --ink-2:#9AA8D0; --ink-3:#66759F; --line:#1E2B50;
  --blue:#7098FF; --blue-soft:#18275A; --on-blue:#07122F;
  --late:#FF6B70; --soon:#FFA15A;
  --pi1:#A9D2F5; --pi2:#AEDFB8; --pi3:#EFDD8A; --pi4:#EFB9CD;
  --pi1-e:#7FB4E3; --pi2-e:#80C394; --pi3-e:#D4BE5B; --pi4-e:#D98FAC;
  --note-ink:#132B6B; --note-late:#A3101A;
  --note-shadow:0 1px 1px rgba(0,0,0,.45),0 12px 22px -10px rgba(0,0,0,.85);
  --hdr:rgba(7,12,28,.84); --tabbar:rgba(15,23,49,.88); --scrim:rgba(0,0,0,.58);
  --toast-bg:#E6ECFF; --toast-ink:#07122F; --toast-act:#1C4ED8;
  --tint:16%; --cal-mix:46%; --tape:rgba(255,255,255,.38);
  --swipe-alt:#33426E; --spk-top:#34436F; --spk-side:#1B2548; --spk-rim:rgba(255,255,255,.18); --metal-hi:#DDE3F0; --metal-lo:#6E7899; --spk-shadow:rgba(0,0,0,.35);
}

:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --font-ui:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-hand:"Caveat","Bradley Hand","Segoe Print","Comic Sans MS",cursive;
  --r-lg:18px;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100%}
body.lock{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;flex:none}

.w1{--pi-c:var(--pi1);--pi-e:var(--pi1-e)}
.w2{--pi-c:var(--pi2);--pi-e:var(--pi2-e)}
.w3{--pi-c:var(--pi3);--pi-e:var(--pi3-e)}
.w4{--pi-c:var(--pi4);--pi-e:var(--pi4-e)}

.app{max-width:640px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom,0px))}

/* ---------- Header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 -16px;padding:14px 16px 10px;background:var(--hdr);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border-bottom:1px solid transparent;transition:border-color .2s}
.top::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top,0px);background:var(--hdr)}
.top.scrolled{border-bottom-color:var(--line)}
.top.connecting::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:28%;background:var(--blue);animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(380%)}}
.top-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px}
.today-note{position:relative;width:54px;height:54px;background:var(--pi-c);border-radius:2px 2px 2px 12px;transform:rotate(-4deg);box-shadow:var(--note-shadow);display:grid;place-items:center;transition:transform .2s}
.today-note:active{transform:rotate(-1deg) scale(.96)}
.today-note::after{content:"";position:absolute;right:0;bottom:0;width:13px;height:13px;background:linear-gradient(to top left,transparent 50%,var(--pi-e) 50%);border-radius:0 0 2px 0}
.tn-day{font-family:var(--font-hand);font-weight:700;font-size:33px;line-height:1;color:var(--note-ink);transform:translateY(1px)}
.titles{min-width:0}
.titles h1{font-size:34px;line-height:1.02;font-weight:800;letter-spacing:-.028em;font-variation-settings:"opsz" 96;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titles p{font-size:14px;line-height:1.3;color:var(--ink-2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.top-actions{display:flex;align-items:center;gap:10px}
.ring{position:relative;width:44px;height:44px}
.ring svg{width:44px;height:44px;display:block}
.ring-track{fill:none;stroke:var(--line);stroke-width:4}
.ring-val{fill:none;stroke:var(--blue);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring-t{position:absolute;inset:0;display:grid;place-items:center;font-size:11.5px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.icon-btn .ic{width:20px;height:20px}
.icon-btn.sm{width:34px;height:34px}

.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:0 16px 2px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.filters.sub{margin-top:8px}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;background:var(--paper);border:1px solid var(--line);font-size:14px;font-weight:560;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.chip .ic{width:16px;height:16px}
.chip .n{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:650}
.chip.zero{color:var(--ink-3)}
.chip.sm{height:30px;font-size:13px;padding:0 11px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}

/* ---------- Secciones y filas ---------- */
.sec{margin-top:24px}
.sec-h{display:flex;align-items:baseline;gap:8px;padding:0 4px 8px;width:100%;text-align:left}
.sec-h h2{font-size:20px;font-weight:760;letter-spacing:-.015em;line-height:1.2}
.sec-h .count{font-size:15px;font-weight:650;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sec-h .act{margin-left:auto;font-size:14px;font-weight:650;color:var(--blue);padding:4px 2px}
.sec-h .hint{font-size:14px;color:var(--ink-3);font-weight:500}
.sec-late .sec-h h2{color:var(--late)}
.fold .fold-ic{margin-left:auto;width:18px;height:18px;color:var(--ink-3);transition:transform .2s;align-self:center}
.fold[aria-expanded="true"] .fold-ic{transform:rotate(180deg)}
.list{list-style:none;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.rw{position:relative;overflow:hidden}
.row{position:relative;touch-action:pan-y;display:flex;align-items:flex-start;gap:12px;padding:13px 14px 13px 19px;background:linear-gradient(90deg,color-mix(in srgb,var(--pi-c) var(--tint),var(--paper)) 0,var(--paper) 88px)}
.row::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--pi-c)}
.row.old::after{background:repeating-linear-gradient(180deg,var(--pi-c) 0 7px,var(--late) 7px 11px)}
.rw+.rw>.row::before,.row+.row::before{content:"";position:absolute;top:0;left:56px;right:0;height:1px;background:var(--line)}
.check{flex:none;width:26px;height:26px;margin-top:1px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;transition:background .18s,border-color .18s,transform .18s}
.check:active{transform:scale(.88)}
.check svg{width:14px;height:14px;fill:none;stroke:var(--on-blue);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .22s .06s}
.completing .check,.check.on{background:var(--blue);border-color:var(--blue)}
.completing .check svg,.check.on svg{stroke-dashoffset:0}
.completing .rtitle{text-decoration:line-through;color:var(--ink-3)}
.rbody{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:5px}
.rtitle{font-size:16px;font-weight:560;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;transition:color .2s}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13px;color:var(--ink-2);line-height:1.25}
.meta .cat{display:inline-flex;align-items:center;gap:4px}
.meta .ic{width:15px;height:15px}
.due{font-weight:600}
.due.late{color:var(--late);font-weight:700}
.due.today{color:var(--blue);font-weight:700}
.due.soon{color:var(--soon);font-weight:700}
.kind{font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}
.oldtag{font-size:12px;font-weight:750;color:var(--late);border:1.5px solid var(--late);padding:0 6px;border-radius:6px;line-height:18px}
.src{color:var(--blue);font-size:13px}
.row.done{background:var(--paper)}
.swipe-under{position:absolute;inset:0;pointer-events:none}
.su{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding:0 22px;font-size:14px;font-weight:720;opacity:0}
.su .ic{width:22px;height:22px;transition:transform .15s}
.su-l{background:var(--blue);color:var(--on-blue)}
.su-r{background:var(--swipe-alt);color:#fff;justify-content:flex-end}
.rw[data-dir="r"] .su-l,.rw[data-dir="l"] .su-r{opacity:1}
.rw.armed .su .ic{transform:scale(1.3)}
.rw.swiping .row{box-shadow:0 1px 8px rgba(0,0,0,.12)}
.row.done .rtitle{text-decoration:line-through;color:var(--ink-3)}

.more-link{display:block;margin:16px auto 0;font-size:15px;font-weight:650;color:var(--blue);padding:8px 12px}
.late-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:14px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--late) 10%,var(--paper));border:1px solid color-mix(in srgb,var(--late) 28%,transparent);color:var(--late);font-weight:650;font-size:15px;text-align:left}
.late-banner .ic{width:18px;height:18px}
.banner{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--paper-2);color:var(--ink-2);font-size:14px}
.muted-center{text-align:center;color:var(--ink-2);font-size:15px;padding:26px 12px}

.tip{display:grid;grid-template-columns:auto 1fr;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-top:16px}
.tip-notes{display:grid;grid-template-columns:repeat(2,18px);gap:5px;align-content:start;padding-top:3px}
.tip h3{font-size:16px;font-weight:750;margin-bottom:6px}
.tip p{font-size:14px;color:var(--ink-2);line-height:1.45}
.tip p+p{margin-top:8px}
.tip-ok{margin-top:12px;font-size:14px;font-weight:700;color:var(--blue);padding:4px 0}
.sw{display:inline-block;width:14px;height:14px;border-radius:2px 2px 2px 5px;background:var(--pi-c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);flex:none}
.tip-notes .sw{width:18px;height:18px}
.sw.old{background:repeating-linear-gradient(135deg,var(--late) 0 2.5px,transparent 2.5px 5px);box-shadow:inset 0 0 0 1.5px var(--late)}

.empty{text-align:center;padding:42px 12px 6px}
.empty-note{position:relative;width:150px;height:150px;margin:0 auto;background:var(--pi-c);border-radius:2px 2px 2px 16px;box-shadow:var(--note-shadow);transform:rotate(-3deg);display:grid;place-items:center;padding:14px;font-family:var(--font-hand);font-size:31px;font-weight:700;line-height:1;color:var(--note-ink)}
.empty-note::after{content:"";position:absolute;right:0;bottom:0;width:22px;height:22px;background:linear-gradient(to top left,transparent 50%,var(--pi-e) 50%)}
.empty p{max-width:300px;margin:24px auto 0;color:var(--ink-2);font-size:15px}

/* ---------- Mes ---------- */
.cal{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 12px 14px;margin-top:14px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-back{font-size:14px;font-weight:650;color:var(--blue);padding:6px 8px}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow span{text-align:center;font-size:12px;font-weight:650;color:var(--ink-3);padding-bottom:3px}
.cd{position:relative;aspect-ratio:1;border-radius:3px 3px 3px 10px;background:color-mix(in srgb,var(--pi-c) var(--cal-mix),var(--paper));display:grid;place-items:center;font-size:15px;font-weight:620;font-variant-numeric:tabular-nums;color:var(--ink)}
.cd.pad{background:none}
.cd.past{opacity:.42}
.cd.today{background:var(--pi-c);color:var(--note-ink);font-weight:800;box-shadow:0 0 0 2px var(--blue)}
.cd.sel{box-shadow:0 0 0 2px var(--ink)}
.cd.today.sel{box-shadow:0 0 0 2px var(--blue),0 0 0 4px var(--ink)}
.cd.ev::before{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.cd.today.ev::before{background:var(--note-ink)}
.cd-dots{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.cd-dots i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6}

/* ---------- Clavo ---------- */
.spike{display:grid;grid-template-columns:128px minmax(0,1fr);gap:0 14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:6px 16px 6px 6px;margin-top:14px}
.spike svg{width:128px;height:208px;display:block;overflow:visible}
.sb-side{fill:var(--spk-side)}
.sb-top{fill:var(--spk-top)}
.sb-rim{fill:none;stroke:var(--spk-rim);stroke-width:1.2}
.sb-shadow{fill:var(--spk-shadow)}
.sm-lo{stop-color:var(--metal-lo)}
.sm-hi{stop-color:var(--metal-hi)}
.pt{fill:var(--pi-c)}
.pe{fill:var(--pi-e)}
.spike .drop{animation:drop .55s cubic-bezier(.3,1.35,.5,1) both}
@keyframes drop{0%{transform:translateY(-54px);opacity:0}50%{opacity:1}100%{transform:none;opacity:1}}
.spike-n{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.spike-l{font-size:14px;color:var(--ink-2);margin-top:5px;line-height:1.35}
.spike-sw{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:13px;font-weight:650;color:var(--ink-2);font-variant-numeric:tabular-nums}
.spike-sw span{display:inline-flex;align-items:center;gap:5px}
.spike-cmp{font-size:13px;color:var(--ink-3);margin-top:10px;line-height:1.35}
.install{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 8px 12px 12px;margin-top:14px}
.install img{width:46px;height:46px;border-radius:11px;display:block}
.install h3{font-size:15px;font-weight:750}
.install p{font-size:13px;color:var(--ink-2);line-height:1.4;margin-top:2px}
.install .btn{margin-top:8px}
.install .x{width:34px;height:34px;display:grid;place-items:center;color:var(--ink-3);align-self:start}
.install .x .ic{width:18px;height:18px}
.app,.tabbar,.quick,.modal{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.rbody:active .rtitle,.note-body:active .note-title{opacity:.62}

/* ---------- Muro ---------- */
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--ink-2);margin:16px 4px 0}
.lg{display:inline-flex;align-items:center;gap:6px}
.wall-note{font-size:14px;color:var(--ink-2);margin:10px 4px 0}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:26px 16px;padding:26px 4px 12px}
.note{position:relative;min-height:156px;background:var(--pi-c);color:var(--note-ink);border-radius:2px 2px 3px 16px;box-shadow:var(--note-shadow);transform:rotate(var(--r,0deg));display:flex;flex-direction:column}
.note::after{content:"";position:absolute;right:0;bottom:0;width:18px;height:18px;background:linear-gradient(to top left,transparent 50%,var(--pi-e) 50%)}
.tape{position:absolute;top:-10px;left:50%;width:62px;height:20px;transform:translateX(-50%) rotate(-3deg);background:var(--tape);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.note.old .tape{background:rgba(214,52,58,.42)}
.note-body{flex:1;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:20px 14px 0;color:inherit;width:100%}
.note-cat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;opacity:.72}
.note-cat .ic{width:14px;height:14px}
.note-title{font-family:var(--font-hand);font-size:25px;font-weight:600;line-height:1.02;margin-top:6px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.note-foot{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:12px;font-weight:650;padding:10px 46px 12px 14px;opacity:.85}
.note-foot .late{color:var(--note-late);opacity:1}
.note-check{position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:50%;border:2px solid color-mix(in srgb,var(--note-ink) 45%,transparent);display:grid;place-items:center;z-index:1}
.note-check svg{width:14px;height:14px;fill:none;stroke:var(--pi-c);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .2s .05s}
.note.completing .note-check{background:var(--note-ink);border-color:var(--note-ink)}
.note.completing .note-check svg{stroke-dashoffset:0}
.note.completing{animation:peel .55s cubic-bezier(.55,0,.75,.35) .12s forwards;transform-origin:50% 0;z-index:2}
@keyframes peel{0%{transform:rotate(var(--r))}35%{transform:rotate(calc(var(--r) - 7deg)) translateY(-8px) scale(1.03)}100%{transform:rotate(calc(var(--r) + 26deg)) translate(50px,130px) scale(.9);opacity:0}}
.stamp{position:absolute;top:12px;right:8px;transform:rotate(9deg);font-size:11px;font-weight:800;color:var(--note-late);border:2px solid var(--note-late);border-radius:4px;padding:0 5px;line-height:17px;background:rgba(255,255,255,.3)}

/* ---------- Barra inferior ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tabbar);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);border-top:1px solid var(--line);padding:0 8px env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{position:relative;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:650;color:var(--ink-3)}
.tab .ic{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--blue)}
.tab .badge{position:absolute;top:5px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--late);color:#fff;font-size:11px;font-weight:750;line-height:18px}
.fab{justify-self:center;width:58px;height:58px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;transform:translateY(-14px);box-shadow:0 10px 22px -8px color-mix(in srgb,var(--blue) 75%,transparent),0 0 0 5px var(--bg);transition:transform .15s}
.fab:active{transform:translateY(-14px) scale(.93)}
.fab .ic{width:28px;height:28px;stroke-width:2.4}

/* ---------- Agregar rápido (panel superior) ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.quick{position:fixed;left:0;right:0;top:0;z-index:41;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 10px;transform:translateY(calc(-100% - 20px));transition:transform .3s cubic-bezier(.2,.85,.25,1);pointer-events:none}
.quick.on{transform:none;pointer-events:auto}
.quick-card{max-width:600px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 24px 50px -20px rgba(0,0,0,.55)}
.q-input{display:flex;gap:8px}
.q-input input{flex:1;min-width:0;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;font-size:17px;outline:none}
.q-input input:focus{border-color:var(--blue)}
.q-add{height:50px;padding:0 16px;border-radius:14px;background:var(--blue);color:var(--on-blue);font-weight:750;font-size:16px}
.q-add:disabled{opacity:.38}
.q-parse{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 10px 9px 12px;border-radius:12px;background:var(--blue-soft);color:var(--ink);font-size:14px;line-height:1.3}
.q-parse .ic{width:17px;height:17px;color:var(--blue)}
.q-parse span{flex:1;min-width:0}
.q-parse button{flex:none;font-size:13px;font-weight:700;color:var(--blue);padding:4px 2px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pills.picker{padding:10px;border-radius:14px;background:var(--paper-2);margin-top:8px}
.pill{position:relative;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--paper);font-size:14px;font-weight:560;white-space:nowrap}
.pill .ic{width:16px;height:16px}
.pill .dd{width:14px;height:14px;opacity:.55;margin-right:-3px}
.pill .auto{font-size:11px;font-weight:700;color:var(--ink-3)}
.pill.on{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.pill.on .auto{color:inherit;opacity:.7}
.pill.set{border-color:var(--blue);color:var(--blue)}
.pill.date input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.pill.tag{padding-right:4px}
.pill.tag button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.pill.tag .ic{width:14px;height:14px}
.newsubj{display:inline-flex;gap:6px}
.subj-in{height:34px;width:150px;border-radius:17px;border:1px solid var(--line);background:var(--paper);padding:0 12px;font-size:16px;outline:none}
.subj-in:focus{border-color:var(--blue)}
.q-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.q-foot span{font-size:14px;color:var(--ink-2);font-weight:600;min-height:1em}
.q-done{font-size:15px;font-weight:700;color:var(--blue);padding:6px 4px}

/* ---------- Modales ---------- */
.modal{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.85,.25,1);visibility:hidden}
.modal.on{transform:none;visibility:visible}
.modal-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;border-bottom:1px solid var(--line);background:var(--hdr)}
.modal-head h2{font-size:17px;font-weight:750}
.mh-btn{justify-self:start;font-size:16px;color:var(--blue);padding:8px 6px}
.mh-btn.strong{justify-self:end;font-weight:750}
.modal-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.modal-in{max-width:600px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.e-note{position:relative;background:var(--pi-c);border-radius:2px 2px 2px 16px;box-shadow:var(--note-shadow);transform:rotate(-1deg);margin:8px 4px 26px;padding:18px 16px 14px}
.e-note::after{content:"";position:absolute;right:0;bottom:0;width:20px;height:20px;background:linear-gradient(to top left,transparent 50%,var(--pi-e) 50%)}
.e-note textarea{display:block;width:100%;border:0;background:transparent;resize:none;outline:none;font-family:var(--font-hand);font-size:29px;font-weight:600;line-height:1.08;color:var(--note-ink);min-height:64px}
.e-block{margin-top:20px}
.e-block h3,.s-block h3{font-size:15px;font-weight:720;color:var(--ink-2);margin:0 2px 9px}
.e-block .pills{margin-top:0}
.e-cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.e-cats button{height:66px;border-radius:14px;background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:620}
.e-cats button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;border-radius:12px;background:var(--paper-2)}
.seg button{height:38px;border-radius:9px;font-size:14px;font-weight:620;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.e-notes{width:100%;min-height:88px;border-radius:14px;border:1px solid var(--line);background:var(--paper);padding:12px 14px;font-size:16px;resize:vertical;outline:none}
.e-notes:focus{border-color:var(--blue)}
.e-info{display:flex;gap:12px;align-items:flex-start;margin-top:22px;padding:14px;border-radius:14px;background:var(--paper-2);font-size:14px;color:var(--ink-2);line-height:1.45}
.e-info .sw{width:20px;height:20px;margin-top:1px}
.e-actions{display:grid;gap:10px;margin-top:22px}
.e-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:48px;border-radius:14px;padding:0 14px;font-size:15px;font-weight:680;background:var(--paper);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn .ic{width:19px;height:19px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.danger{color:var(--late)}
.btn.armed{background:var(--late);border-color:var(--late);color:#fff}
.btn.small{min-height:36px;font-size:14px;border-radius:11px}
.s-block{padding:18px 0;border-bottom:1px solid var(--line)}
.s-block:first-child{padding-top:4px}
.s-block:last-child{border-bottom:0}
.s-p{font-size:14px;color:var(--ink-2);line-height:1.5}
.s-p+.s-p{margin-top:8px}
.s-colors{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:6px 0 14px}
.s-col{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:650;color:var(--ink-2)}
.bignote{position:relative;width:100%;aspect-ratio:1;max-width:76px;background:var(--pi-c);border-radius:2px 2px 2px 10px;box-shadow:var(--note-shadow);display:grid;place-items:center;font-family:var(--font-hand);font-size:22px;font-weight:700;color:var(--note-ink)}
.s-col:nth-child(odd) .bignote{transform:rotate(-2.5deg)}
.s-col:nth-child(even) .bignote{transform:rotate(2deg)}
.s-add{display:flex;gap:8px;margin-top:12px}
.s-add input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:0 12px;font-size:16px;outline:none}
.s-add input:focus{border-color:var(--blue)}
.s-add .btn{min-height:44px}
.hist{list-style:none;margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}
.hist li{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:14px}
.hist li+li{border-top:1px solid var(--line)}
.hist .t{flex:1;min-width:0;color:var(--ink-2);text-decoration:line-through;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .d{font-size:12px;color:var(--ink-3);flex:none}
.backup{margin-top:12px;min-height:96px;font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.hist button{flex:none;font-size:13px;font-weight:700;color:var(--blue);padding:4px}
.stat{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.stat b{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--ink-2)}
.s-switch{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 12px 10px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--line);text-align:left}
.s-switch .t{flex:1;min-width:0}
.s-switch .t b{display:block;font-size:15px;font-weight:680;color:var(--ink)}
.s-switch .t span{display:block;font-size:13px;color:var(--ink-2);line-height:1.35;margin-top:2px}
.s-switch .knob{flex:none;position:relative;width:51px;height:31px;border-radius:16px;background:color-mix(in srgb,var(--ink-3) 34%,var(--paper));transition:background-color .2s}
.s-switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.25,.5,1)}
.s-switch[aria-checked="true"] .knob{background:var(--blue)}
.s-switch[aria-checked="true"] .knob::after{transform:translateX(20px)}
.s-note{margin-top:10px}
.s-stack{display:grid;gap:8px}
.s-switch[aria-busy="true"]{opacity:.6;pointer-events:none}
.s-daily{display:flex;align-items:center;gap:10px;padding:2px 2px 4px}
.s-hour{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-size:15px;font-weight:620;color:var(--ink-2)}
.s-hour select{height:40px;border-radius:11px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:0 10px;font-size:16px;font-weight:620}
.btn:disabled{opacity:.45}
.bdemo{position:relative;display:block}
.bdemo b{position:absolute;top:-7px;right:-8px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--late);color:#fff;font-size:13px;font-weight:750;line-height:22px;text-align:center;box-shadow:0 0 0 2px var(--paper);font-variant-numeric:tabular-nums}

/* ---------- Toast y confeti ---------- */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:16px;max-width:calc(100% - 32px);padding:12px 14px 12px 16px;border-radius:14px;background:var(--toast-bg);color:var(--toast-ink);font-size:15px;font-weight:620;box-shadow:0 14px 30px -12px rgba(0,0,0,.55);opacity:0;transform:translate(-50%,16px);pointer-events:none;transition:opacity .2s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast-act{color:var(--toast-act);font-weight:780;padding:2px}
body.lock .toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.confetti i{position:absolute;width:9px;height:9px;border-radius:1px 1px 1px 3px;animation:conf 1.15s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}

@media (min-width:700px){
  .titles h1{font-size:40px}
  .wall{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top connecting" id="top">
    <div class="top-row">
      <button type="button" class="today-note" id="todayNote" data-act="open-settings" data-focus="colors"><span class="tn-day"></span></button>
      <div class="titles"><h1 id="title">Hoy</h1><p id="subtitle"></p></div>
      <div class="top-actions">
        <div class="ring" id="ring" hidden></div>
        <button type="button" class="icon-btn" data-act="open-settings" aria-label="Ajustes" data-icon="sliders"></button>
      </div>
    </div>
    <div class="filters" id="filters" aria-label="Filtrar por categoría"></div>
    <div class="filters sub" id="subfilters" aria-label="Filtrar por ramo" hidden></div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar" aria-label="Secciones">
  <div class="tabbar-in">
    <button type="button" class="tab" data-act="tab" data-tab="hoy" data-icon="sun"><span>Hoy</span></button>
    <button type="button" class="tab" data-act="tab" data-tab="semana" data-icon="week"><span>Semana</span></button>
    <button type="button" class="fab" data-act="add" aria-label="Agregar tarea" data-icon="plus"></button>
    <button type="button" class="tab" data-act="tab" data-tab="mes" data-icon="month"><span>Mes</span></button>
    <button type="button" class="tab" data-act="tab" data-tab="muro" data-icon="wall"><span>Muro</span></button>
  </div>
</nav>

<div class="scrim" id="quickScrim" data-act="q-close"></div>
<section class="quick" id="quick" inert aria-label="Agregar tarea">
  <form class="quick-card" id="quickForm" autocomplete="off" novalidate>
    <div class="q-input">
      <input id="qText" type="text" maxlength="200" enterkeyhint="done" placeholder="¿Qué tienes que hacer?" aria-label="Nueva tarea">
      <button type="submit" class="q-add" id="qAdd" disabled>Agregar</button>
    </div>
    <div id="qParse"></div>
    <div class="pills" id="qMeta"></div>
    <div class="pills picker" id="qCatPick" hidden></div>
    <div class="pills picker" id="qSubjPick" hidden></div>
    <div class="pills" id="qWhen"></div>
    <div class="q-foot"><span id="qMsg" role="status"></span><button type="button" class="q-done" data-act="q-close">Listo</button></div>
  </form>
</section>

<div class="modal" id="edit" inert role="dialog" aria-modal="true" aria-labelledby="editTitle">
  <div class="modal-head"><button type="button" class="mh-btn" data-act="e-cancel">Cancelar</button><h2 id="editTitle">Tarea</h2><button type="button" class="mh-btn strong" data-act="e-save">Guardar</button></div>
  <div class="modal-body"><div class="modal-in" id="editBody"></div></div>
</div>

<div class="modal" id="settings" inert role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="modal-head"><span></span><h2 id="setTitle">Ajustes</h2><button type="button" class="mh-btn strong" data-act="s-close">Listo</button></div>
  <div class="modal-body" id="setScroll"><div class="modal-in" id="setBody"></div></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
/*CORE-START*/
const CATS={
  universidad:{name:'Universidad',icon:'cap'},
  deporte:{name:'Deporte',icon:'glove'},
  ocio:{name:'Ocio',icon:'pad'},
  trabajo:{name:'Trabajo',icon:'case'},
  dinero:{name:'Dinero',icon:'money'},
  personal:{name:'Personal',icon:'person'}
};
const CAT_ORDER=['universidad','deporte','ocio','trabajo','dinero','personal'];
const KINDS={tarea:'Tarea',evaluacion:'Evaluación',entrega:'Entrega'};
const DAYS_LONG=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DAYS_SHORT=['dom','lun','mar','mié','jue','vie','sáb'];
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MONTHS_SHORT=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const WEEK_COLOR=['','azul','verde','amarillo','rosa'];
const WEEK_RANGE=['','1–7','8–14','15–21','22–fin'];

/* ---- fechas (siempre en hora local, a mediodía para esquivar cambios de horario) ---- */
function pad2(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}

function whenFor(key,today){
  switch(key){
    case 'hoy':return {horizon:'dia',due:today};
    case 'manana':return {horizon:'dia',due:addDays(today,1)};
    case 'finde':return {horizon:'finde',due:weekEnd(today)};
    case 'semana':return {horizon:'semana',due:weekEnd(today)};
    case 'proxsemana':return {horizon:'semana',due:addDays(weekEnd(today),7)};
    case 'mes':return {horizon:'mes',due:monthEnd(today)};
    case 'proxmes':return {horizon:'mes',due:monthEnd(addMonths(today,1))};
    default:return {horizon:'algun',due:null};
  }
}
function whenKey(w,today){
  if(!w||w.horizon==='algun'||!w.due)return 'algun';
  if(w.horizon==='dia'){if(w.due===today)return 'hoy';if(w.due===addDays(today,1))return 'manana';return 'fecha'}
  if(w.horizon==='finde')return w.due===weekEnd(today)?'finde':'fecha';
  if(w.horizon==='semana'){if(w.due===weekEnd(today))return 'semana';if(w.due===addDays(weekEnd(today),7))return 'proxsemana';return 'fecha'}
  if(w.horizon==='mes'){if(w.due===monthEnd(today))return 'mes';if(w.due===monthEnd(addMonths(today,1)))return 'proxmes';return 'fecha'}
  return 'fecha';
}
function whenText(w,today){
  if(!w||w.horizon==='algun'||!w.due)return 'sin fecha';
  if(w.horizon==='dia'){const dd=diffDays(today,w.due);if(dd===0)return 'hoy';if(dd===1)return 'mañana';if(dd===2)return 'pasado mañana';return fmtDay(w.due)}
  if(w.horizon==='finde'){if(w.due===weekEnd(today))return 'el finde';if(w.due===addDays(weekEnd(today),7))return 'el próximo finde';return 'el finde del '+fmtShort(addDays(w.due,-1))}
  if(w.horizon==='semana'){if(w.due===weekEnd(today))return 'esta semana';if(w.due===addDays(weekEnd(today),7))return 'la próxima semana';return 'la semana del '+fmtShort(weekStart(w.due))}
  if(w.horizon==='mes'){if(w.due.slice(0,7)===today.slice(0,7))return 'este mes';return MONTHS[parseYMD(w.due).getMonth()]}

}

function forToday(t,today){return !!t.due&&(t.due===today||(t.horizon==='finde'&&t.due===addDays(today,1)))}

function clipText(s,n){s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1).trimEnd()+'…':s}

  const pend=(tasks||[]).filter(t=>t&&!t.done),byDue=(a,b)=>a.due<b.due?-1:a.due>b.due?1:0,rank=k=>k==='evaluacion'?0:k==='entrega'?1:2;
  const late=pend.filter(t=>t.due&&t.due<today).sort(byDue);
  const hoy=pend.filter(t=>forToday(t,today)).sort((a,b)=>rank(a.kind)-rank(b.kind));
  const next=pend.filter(t=>t.kind!=='tarea'&&t.due&&t.due>today&&!forToday(t,today)&&diffDays(today,t.due)<=7).sort(byDue)[0];
  const nextLine=next?clipText(next.title,48)+' '+inDaysText(diffDays(today,next.due)):'';
  const n=late.length+hoy.length;
  if(!n)return {n:0,late:0,title:next?'Nada para hoy':'Día despejado',body:next?nextLine+'.':'No tienes nada para hoy.'};
  let title=n===1?'Hoy te queda 1 tarea':'Hoy te quedan '+n+' tareas';
  if(late.length)title+=' · '+late.length+(late.length===1?' atrasada':' atrasadas');
  const list=late.concat(hoy),lines=list.slice(0,3).map(t=>clipText(t.title,42));
  if(list.length>3)lines.push('y '+(list.length-3)+' más');
  if(next)lines.push(nextLine);
  return {n,late:late.length,title,body:lines.join('\n')};
}

let RULE_LIST=null,BASE_WORD=null;
function ruleList(){
  if(RULE_LIST)return RULE_LIST;
  const out=[],seen=new Set();
  for(const [cat,w,src] of RULES){
    for(const raw of src.split('|')){
      const k=norm(raw);if(!k)continue;
      const vs=[k];
      if(k.indexOf(' ')<0){if(!/s$/.test(k))vs.push(k+'s');if(/[^aeious]$/.test(k))vs.push(k+'es')}
      for(const v of vs){if(seen.has(v))continue;seen.add(v);out.push({cat,w,k:v})}
    }
  }
  out.sort((a,b)=>b.k.length-a.k.length||b.w-a.w);
  RULE_LIST=out;return out;
}
function baseWordCat(w){

function matchRules(n){
  let s=' '+n+' ';const scores={};

    const needle=' '+r.k+' ';let i=s.indexOf(needle);
    while(i!==-1){
      scores[r.cat]=(scores[r.cat]||0)+r.w;
      s=s.slice(0,i+1)+'#'.repeat(r.k.length)+s.slice(i+1+r.k.length);
      i=s.indexOf(needle,i+1);
    }

}
function detectSubject(n,subjects){

  const s=' '+n+' ';let best=null,bl=0;
  for(const name of subjects){const k=norm(name);if(k&&s.indexOf(' '+k+' ')>=0&&k.length>bl){best=name;bl=k.length}}
  if(best)return best;
  const firsts={};
  for(const name of subjects){const w=norm(name).split(' ').find(x=>x.length>=5&&!STOP.has(x));if(w)(firsts[w]=firsts[w]||[]).push(name)}
  for(const w in firsts){if(firsts[w].length===1&&s.indexOf(' '+w+' ')>=0)return firsts[w][0]}
  return null;
}
function detectKind(n){
  if(/(^| )(medic[oa]s?|doctor[a]?|dentista|sangre|clinica|dental|kine|kinesiologo|dermatolog[oa])( |$)/.test(n))return 'tarea';

  if(/(^| )(pruebas?|control(es)?|examen(es)?|solemnes?|certamen(es)?|quiz|interrogacion(es)?|disertacion|exposicion)( |$)/.test(n))return 'evaluacion';

function classify(title,learning,subjects){

  const scores=matchRules(n);

  const lt=(learning&&learning.tokens)||{};
  for(const w of tokens(n)){const e=lt[w];if(!e)continue;for(const c in e){if(CATS[c])scores[c]=(scores[c]||0)+3*Math.min(3,e[c]|0)}}

  if(ph&&CATS[ph]){best=ph;bs=99}
  res.category=best;res.confident=bs>0;res.scores=scores;res.kind=detectKind(n);
  res.subject=best==='universidad'?subj:null;

}
function learnCorrection(learning,title,fromCat,toCat){
  const n=norm(title);

  learning.tokens=learning.tokens||{};learning.phrases=learning.phrases||{};

  let toks=tokens(n);
  const informative=toks.filter(w=>baseWordCat(w)!==fromCat);
  if(informative.length)toks=informative;
  for(const w of toks){
    const e=learning.tokens[w]||(learning.tokens[w]={});
    e[toCat]=Math.min(9,(e[toCat]||0)+1);
    if(e[fromCat]){e[fromCat]--;if(e[fromCat]<=0)delete e[fromCat]}

    const r=p.fn(m,today);if(!r)continue;
    cands.push({start:m.index,end:m.index+m[0].length,when:r,match:m[0]});
  }
  if(!cands.length)return null;
  cands.sort((a,b)=>a.start-b.start||(b.end-b.start)-(a.end-a.start));
  const c=cands[0];
  const title=cleanTitle(text.slice(0,c.start)+' '+text.slice(c.end));
  return {when:c.when,match:c.match.trim(),title};
}

function normTask(id,d){
  d=d||{};

    category:CATS[d.category]?d.category:'personal',

    kind:KINDS[d.kind]?d.kind:'tarea',
    horizon:['dia','finde','semana','mes','algun'].indexOf(d.horizon)>=0?d.horizon:(isYMD(d.due)?'dia':'algun'),
    due:isYMD(d.due)?d.due:null,
    notes:typeof d.notes==='string'?d.notes.slice(0,2000):'',
    created:isYMD(d.created)?d.created:((d.createdAt&&localDate(d.createdAt))||todayStr()),
    createdAt:typeof d.createdAt==='string'?d.createdAt:null,

let unsubs=[],resubTimer=null,cacheTimer=null,learnDirty=false;

  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];

    for(const d of snap.docs){const data=d.data();if(data)m.set(d.id,normTask(d.id,data))}

  },onSubError));

  unsubs.push(DB.doc('meta/learning').onSnapshot(s=>{if(!learnDirty)S.learning=normLearning(s.exists?s.data():null)},onSubError));
}

const chains=new Map();

}

/* ---- textos de fecha ---- */
function dueInfo(t,today,o){
  o=o||{};
  if(!t.due)return {text:'Sin fecha',tone:'muted'};
  const dd=diffDays(today,t.due);
  if(dd<0){
    if(t.horizon==='semana')return {text:dd>=-7?'Semana pasada':'Hace '+Math.ceil(-dd/7)+' semanas',tone:'late'};
    if(t.horizon==='mes')return {text:'Mes pasado',tone:'late'};
    if(t.horizon==='finde')return {text:dd>=-7?'Finde pasado':'Hace '+Math.ceil(-dd/7)+' semanas',tone:'late'};
    return {text:dd===-1?'Ayer':'Hace '+(-dd)+' días',tone:'late'};
  }
  if(t.horizon==='finde'){
    if(dd===0)return {text:'Cierra hoy',tone:'today'};
    if(dd===1&&dow(today)===6)return {text:'Hoy o mañana',tone:'today'};
    if(t.due===weekEnd(today))return {text:'Este finde',tone:'muted'};
    if(t.due===addDays(weekEnd(today),7))return {text:'Próximo finde',tone:'muted'};
    return {text:'Finde del '+fmtShort(addDays(t.due,-1)),tone:'muted'};
  }
  if(t.horizon==='semana'){
    if(dd===0)return {text:'Cierra hoy',tone:'today'};
    if(t.due===weekEnd(today))return {text:'Esta semana',tone:'muted'};
    if(t.due===addDays(weekEnd(today),7))return {text:'Próxima semana',tone:'muted'};
    return {text:'Semana del '+fmtShort(weekStart(t.due)),tone:'muted'};
  }
  if(t.horizon==='mes'){
    if(dd===0)return {text:'Cierra hoy',tone:'today'};
    if(t.due.slice(0,7)===today.slice(0,7))return dd<=3?{text:'Este mes, quedan '+dd+(dd===1?' día':' días'),tone:'soon'}:{text:'Este mes',tone:'muted'};
    return {text:cap1(MONTHS[parseYMD(t.due).getMonth()]),tone:'muted'};
  }
  if(dd===0)return {text:'Hoy',tone:'today'};
  const hito=t.kind!=='tarea';
  if(dd===1)return {text:'Mañana',tone:hito?'soon':'muted'};
  if(hito||o.countdown)return {text:dd<=6?'En '+dd+' días':fmtDay(t.due)+', en '+dd+' días',tone:dd<=3?'soon':'muted'};
  if(dd<=6)return {text:cap1(DAYS_LONG[dow(t.due)]),tone:'muted'};
  return {text:fmtDay(t.due),tone:'muted'};
}
function dayTitle(d,today){const dd=diffDays(today,d);if(dd===0)return 'Hoy';if(dd===1)return 'Mañana';return cap1(DAYS_LONG[dow(d)])+' '+parseYMD(d).getDate()}
function rangeText(a,b){const x=parseYMD(a),y=parseYMD(b);if(x.getMonth()===y.getMonth())return x.getDate()+' al '+y.getDate()+' de '+MONTHS[y.getMonth()];return fmtShort(a)+' al '+fmtShort(b)}

function renderHeader(){

function setTab(tab){if(!tab||tab===S.tab){window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});return}S.tab=tab;S.selDay=null;lsSet(LS.tab,tab);render();window.scrollTo(0,0)}
function collapse(el){const h=el.offsetHeight;el.style.height=h+'px';el.style.overflow='hidden';void el.offsetHeight;el.style.transition='height .24s ease,opacity .2s ease,padding .24s ease';el.style.height='0px';el.style.opacity='0';el.style.paddingTop='0';el.style.paddingBottom='0'}
async function completeTask(id,el,o){
  o=o||{};
  const t=S.tasks.get(id);if(!t||t.done)return;
  if(el){if(el.classList.contains('completing'))return;el.classList.add('completing');
    if(!reduceMotion){if(el.classList.contains('note'))await sleep(640);else if(o.swiped){await sleep(120);collapse(el);await sleep(230)}else{await sleep(280);collapse(el);await sleep(230)}}}
  const nt=Object.assign({},t,{done:true,doneAt:new Date().toISOString()});
  putTask(nt);
  toast('Completada',{label:'Deshacer',fn:()=>putTask(Object.assign({},nt,{done:false,doneAt:null}))});
  celebrateIfDayDone();
  setTimeout(maybeArchive,1500);
}
function postponeTarget(t,today){
  if(!t.due||t.horizon==='algun')return whenFor('manana',today);
  const late=t.due<today;
  if(t.horizon==='finde')return {horizon:'finde',due:late?weekEnd(today):addDays(t.due,7)};
  if(t.horizon==='semana')return {horizon:'semana',due:late?weekEnd(today):addDays(t.due,7)};
  if(t.horizon==='mes')return {horizon:'mes',due:late?monthEnd(today):monthEnd(addMonths(t.due,1))};
  return {horizon:'dia',due:addDays(late?today:t.due,1)};
}
function postponeLabel(t,today){const w=postponeTarget(t,today);const k=whenKey(w,today);return k==='manana'?'Mañana':k==='finde'?'Este finde':k==='semana'?'Esta semana':k==='proxsemana'?'Próxima semana':k==='mes'?'Este mes':k==='proxmes'?'Próximo mes':w.horizon==='finde'?'Próximo finde':'Un día más'}
async function postponeTask(id,el){
  const t=S.tasks.get(id);if(!t)return;
  const w=postponeTarget(t,S.today);
  if(el&&!reduceMotion){el.classList.add('completing');await sleep(120);collapse(el);await sleep(230)}
  putTask(Object.assign({},t,w));
  toast('Pospuesta para '+whenText(w,S.today),{label:'Deshacer',fn:()=>putTask(t)});
}
function haptic(){
  try{if(navigator.vibrate){navigator.vibrate(12);return}}catch(e){}
  try{const l=document.createElement('label');l.setAttribute('aria-hidden','true');l.style.display='none';const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');l.appendChild(i);document.head.appendChild(l);l.click();l.remove()}catch(e){}
}
function uncomplete(id){const t=S.tasks.get(id);if(!t)return;putTask(Object.assign({},t,{done:false,doneAt:null}));toast('Volvió a pendientes')}
async function moveLateToToday(){
  const today=S.today,late=pendingList().filter(t=>t.due&&t.due<today);if(!late.length)return;
  for(const t of late)putTask(Object.assign({},t,{horizon:'dia',due:today}));
  toast(late.length===1?'1 tarea pasó a hoy':late.length+' tareas pasaron a hoy');
}
function celebrateIfDayDone(){
  const today=S.today,all=allTasks();
  const pend=all.filter(t=>!t.done&&t.due&&(t.due<=today||forToday(t,today))).length;
  const done=all.filter(t=>t.done&&t.doneAt&&localDate(t.doneAt)===today).length;
  if(pend===0&&done>0&&lsGet(LS.celeb)!==today){lsSet(LS.celeb,today);setTimeout(()=>{confetti();toast('Día despejado. Nada pendiente para hoy.')},350)}
}
function confetti(){
  if(reduceMotion)return;
  const host=document.createElement('div');host.className='confetti';
  const src=$('#ring:not([hidden])')||$('#todayNote');const r=src.getBoundingClientRect();
  const x=r.left+r.width/2,y=r.top+r.height/2;
  const cols=['var(--pi1)','var(--pi2)','var(--pi3)','var(--pi4)','var(--blue)'];
  for(let i=0;i<30;i++){const s=document.createElement('i');const a=Math.random()*Math.PI*2,d=70+Math.random()*130;s.style.cssText='left:'+x+'px;top:'+y+'px;background:'+cols[i%5]+';--dx:'+(Math.cos(a)*d).toFixed(1)+'px;--dy:'+(Math.sin(a)*d+90).toFixed(1)+'px;--rot:'+(Math.random()*720-360).toFixed(0)+'deg;animation-delay:'+(Math.random()*90).toFixed(0)+'ms';host.appendChild(s)}
  document.body.appendChild(host);setTimeout(()=>host.remove(),1500);
}
let toastTimer=null;
function toast(msg,action){
  const el=$('#toast');
  el.innerHTML='<span>'+esc(msg)+'</span>'+(action?'<button type="button" class="toast-act">'+esc(action.label)+'</button>':'');
  if(action)el.querySelector('.toast-act').onclick=()=>{hideToast();action.fn()};
  el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,action?5000:Math.min(7000,Math.max(2800,String(msg).length*60)));
}
function hideToast(){$('#toast').classList.remove('on')}

const Q={manualCat:null,manualKind:null,manualSubject:undefined,manualWhen:null,sticky:false,customDate:null,ignoreParse:false,catPick:false,subjPick:false,msgTimer:null};
function defaultWhenKey(){return S.tab==='semana'?'semana':S.tab==='mes'?'mes':S.tab==='muro'?'algun':'hoy'}
function openQuick(){
  Object.assign(Q,{manualCat:null,manualKind:null,manualSubject:undefined,manualWhen:null,sticky:false,customDate:null,ignoreParse:false,catPick:false,subjPick:false});
  const q=$('#quick'),inp=$('#qText');inp.value='';$('#qMsg').textContent='';
  q.removeAttribute('inert');q.classList.add('on');$('#quickScrim').classList.add('on');document.body.classList.add('lock');
  renderQuick();
  try{inp.focus({preventScroll:true})}catch(e){inp.focus()}
}
function closeQuick(){const q=$('#quick');q.classList.remove('on');q.setAttribute('inert','');$('#quickScrim').classList.remove('on');document.body.classList.remove('lock');$('#qText').blur()}
function computeQuick(){
  const raw=$('#qText').value,today=S.today;
  const parse=(!Q.ignoreParse&&(!Q.manualWhen||Q.sticky)&&raw.trim())?parseWhen(raw,today):null;
  const title=(parse&&parse.title)?parse.title:raw.trim();
  const cls=classify(title,S.learning,allSubjects());
  const cat=Q.manualCat||cls.category;
  const kind=Q.manualKind||cls.kind;
  const subject=cat==='universidad'?(Q.manualSubject!==undefined?Q.manualSubject:cls.subject):null;
  let when;
  if(parse)when=parse.when;
  else if(Q.manualWhen==='fecha'&&Q.customDate)when={horizon:'dia',due:Q.customDate};
  else if(Q.manualWhen)when=whenFor(Q.manualWhen,today);
  else when=whenFor(defaultWhenKey(),today);
  return {raw,parse,title,cls,cat,kind,subject,when};
}

  if(showS){if(!sp.querySelector('.subj-in')||sp.dataset.cur!==(c.subject||'')){sp.innerHTML=subjPickerHTML(c.subject,'q');sp.dataset.cur=c.subject||''}}else{sp.innerHTML='';sp.dataset.cur=''}
  const key=whenKey(c.when,today);

  const other=['fecha','proxsemana','proxmes'].indexOf(key)>=0;
  $('#qWhen').innerHTML=opts.map(([k,l])=>'<button type="button" class="pill'+(key===k?' on':'')+'" data-act="q-when" data-when="'+k+'">'+l+'</button>').join('')+'<label class="pill date'+(other?' on':'')+'">'+icon('cal')+'<span>'+(other?esc(cap1(whenText(c.when,today))):'Fecha')+'</span><input type="date" id="qDate" value="'+(c.when.due||'')+'" aria-label="Elegir fecha"></label>';

function submitQuick(){
  const c=computeQuick();if(!c.raw.trim())return;
  haptic();
  const title=cap1(((c.parse&&c.parse.title)?c.parse.title:c.raw.trim()).slice(0,300));
  const now=new Date().toISOString();
  const t={id:newId(),title,category:c.cat,subject:c.subject||null,kind:c.kind,horizon:c.when.horizon,due:c.when.due||null,notes:'',created:S.today,createdAt:now,done:false,doneAt:null,source:'app'};
  if(Q.manualCat&&Q.manualCat!==c.cls.category){if(learnCorrection(S.learning,title,c.cls.category,Q.manualCat))saveLearningSoon()}
  if(t.subject&&S.config.subjects.map(norm).indexOf(norm(t.subject))<0){S.config.subjects.push(t.subject);saveConfig()}
  putTask(t);
  const msg=$('#qMsg');msg.textContent=t.horizon==='algun'?'Agregada sin fecha':'Agregada para '+whenText(t,S.today);
  clearTimeout(Q.msgTimer);Q.msgTimer=setTimeout(()=>{msg.textContent=''},2600);
  $('#qText').value='';
  Object.assign(Q,{manualCat:null,manualKind:null,manualSubject:undefined,ignoreParse:false,catPick:false,subjPick:false,sticky:!!Q.manualWhen});
  renderQuick();
  try{$('#qText').focus({preventScroll:true})}catch(e){}
}
function addSubjectFrom(p){
  const inp=document.querySelector('.subj-in[data-p="'+p+'"]');if(!inp)return;
  const v=inp.value.trim().slice(0,40);if(!v)return;
  if(S.config.subjects.map(norm).indexOf(norm(v))<0){S.config.subjects.push(v);saveConfig()}
  if(p==='q'){Q.manualSubject=v;Q.subjPick=false;renderQuick();$('#qText').focus()}
  else if(p==='e'&&E){E.subject=v;renderEdit()}
}

function autosize(el){if(!el)return;el.style.height='auto';el.style.height=Math.max(64,el.scrollHeight)+'px'}
function syncEditText(){if(!E)return;const ti=$('#eTitle'),no=$('#eNotes');if(ti)E.title=ti.value;if(no)E.notes=no.value}
function finalizeEdit(){
  syncEditText();
  const t=Object.assign({},E);
  t.title=cap1(String(t.title||'').trim().replace(/\s+/g,' '))||Eorig.title;
  t.notes=String(t.notes||'').trim();
  if(t.category!=='universidad')t.subject=null;
  if(t.horizon==='algun')t.due=null;
  return t;
}
function changed(a,b){const x=toDoc(a),y=toDoc(b);delete x.updatedAt;delete y.updatedAt;return JSON.stringify(x)!==JSON.stringify(y)}
function saveEdit(extra,msg){
  if(!E)return;
  const t=Object.assign(finalizeEdit(),extra||{});
  if(t.category!==Eorig.category){if(learnCorrection(S.learning,t.title,Eorig.category,t.category))saveLearningSoon()}
  if(t.subject&&S.config.subjects.map(norm).indexOf(norm(t.subject))<0){S.config.subjects.push(t.subject);saveConfig()}
  const was=Eorig;
  closeModal('edit');
  if(changed(t,was)){putTask(t);toast(msg||'Cambios guardados',{label:'Deshacer',fn:()=>putTask(was)})}
  E=null;
}

function backupText(){const o={app:'pendientes',v:1,exportedAt:new Date().toISOString(),tasks:{},config:S.config,learning:S.learning,archive:S.localArchive};for(const [id,t] of S.tasks)o.tasks[id]=toDoc(t);return JSON.stringify(o)}
async function copyText(txt){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(txt);return true}}catch(e){}
  try{const ta=$('#sBackupText');if(ta){ta.focus();ta.select();ta.setSelectionRange(0,txt.length);if(document.execCommand('copy'))return true}}catch(e){}
  return false;
}
function restoreBackup(txt){
  let o;try{o=JSON.parse(String(txt||'').trim())}catch(e){return -1}
  if(!o||typeof o!=='object'||!o.tasks||typeof o.tasks!=='object'||Array.isArray(o.tasks))return -1;
  let n=0;
  for(const id in o.tasks){if(!/^[A-Za-z0-9_.~:@+-]{1,200}$/.test(id)||!o.tasks[id]||typeof o.tasks[id]!=='object')continue;S.tasks.set(id,normTask(id,o.tasks[id]));n++}
  if(o.config)S.config.subjects=uniqSorted(S.config.subjects.concat(normConfig(o.config).subjects));
  if(o.learning){const l=normLearning(o.learning);S.learning.tokens=Object.assign({},l.tokens,S.learning.tokens);S.learning.phrases=Object.assign({},l.phrases,S.learning.phrases)}
  if(o.archive){const a=normArchive(o.archive);for(const m in a){const cur=S.localArchive[m]||[0,0,0,0,0];S.localArchive[m]=cur.map((v,i)=>Math.max(v,a[m][i]))}}
  persistLocal();render();return n;
}
async function shareBackup(){
  const txt=backupText(),name='pendientes-respaldo-'+S.today+'.json';
  try{if(navigator.canShare&&navigator.share&&typeof File==='function'){const f=new File([txt],name,{type:'application/json'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Respaldo de Pendientes'});lsSet(LS.lastBackup,S.today);return 'ok'}}}catch(e){if(e&&e.name==='AbortError')return 'cancel'}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);lsSet(LS.lastBackup,S.today);return 'ok'}catch(e){}
  return 'fail';
}

function applyTheme(){const v=lsGet(LS.theme)||'auto';if(v==='light'||v==='dark')document.documentElement.setAttribute('data-app-theme',v);else document.documentElement.removeAttribute('data-app-theme');if(typeof syncThemeColor==='function')syncThemeColor()}
function openSettings(focus){S.resetArmed=false;S.backup=null;renderSettings();showModal('settings');const sc=$('#setScroll');sc.scrollTop=0;if(focus==='colors'){}}
function renderSettings(){
  const theme=lsGet(LS.theme)||'auto',subs=S.config.subjects;
  const learnedN=Object.keys(S.learning.tokens||{}).length+Object.keys(S.learning.phrases||{}).length;

const SW={el:null,row:null,id:null,x0:0,y0:0,dx:0,mode:0,w:0,pid:null,armed:false,last:-1e9};
function swipeReset(){SW.el=null;SW.row=null;SW.id=null;SW.mode=0;SW.dx=0;SW.armed=false;SW.pid=null}
$view.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const li=e.target.closest('.rw');if(!li||li.classList.contains('completing'))return;
  const row=li.querySelector('.row');if(!row)return;
  swipeReset();
  Object.assign(SW,{el:li,row:row,id:li.dataset.id,x0:e.clientX,y0:e.clientY,w:li.offsetWidth||320,pid:e.pointerId});
});
$view.addEventListener('pointermove',e=>{
  if(!SW.el||e.pointerId!==SW.pid)return;
  const dx=e.clientX-SW.x0,dy=e.clientY-SW.y0;
  if(SW.mode===0){
    if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){swipeReset();return}
    if(!(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2))return;
    SW.mode=1;try{SW.el.setPointerCapture(e.pointerId)}catch(err){}
    SW.row.style.transition='none';SW.el.classList.add('swiping');
    const t=S.tasks.get(SW.id);const lt=SW.el.querySelector('.su-t');if(t&&lt)lt.textContent=postponeLabel(t,S.today);
  }
  if(e.cancelable)e.preventDefault();
  SW.dx=dx;
  SW.row.style.transform='translate3d('+dx+'px,0,0)';
  SW.el.dataset.dir=dx>0?'r':'l';
  const armed=Math.abs(dx)>=Math.min(120,SW.w*.34);
  if(armed!==SW.armed){SW.armed=armed;SW.el.classList.toggle('armed',armed)}
},{passive:false});
function swipeEnd(e){
  if(!SW.el||e.pointerId!==SW.pid)return;
  const li=SW.el,row=SW.row,id=SW.id,dx=SW.dx,armed=SW.armed,mode=SW.mode;
  swipeReset();
  if(mode!==1)return;
  SW.last=performance.now();
  li.classList.remove('swiping','armed');
  if(armed&&e.type==='pointerup'){
    haptic();
    row.style.transition='transform .2s ease';
    row.style.transform='translate3d('+(dx>0?'':'-')+'110%,0,0)';
    if(dx>0)completeTask(id,li,{swiped:true});else postponeTask(id,li);
  }else{
    row.style.transition='transform .3s cubic-bezier(.2,.9,.3,1.15)';row.style.transform='';
    setTimeout(()=>{if(!li.classList.contains('swiping'))delete li.dataset.dir},320);
  }
}

/* ---- avisos: número en el ícono y resumen de la mañana (solo en la app instalada) ----
   En iOS los dos van amarrados al permiso de notificaciones. El servidor (servidor/pendientes-push.js) solo guarda la
   dirección de notificaciones y la hora; el resumen lo arma el service worker con la copia en IndexedDB de este teléfono. */
const PUSH_URL='https://pendientes-push.esteban-lands.workers.dev';
const DEVICE=IS_IOS?'el iPhone':'tu dispositivo';
let badgeLast=null,swReg=null,snapLast=null,snapTimer=null,resyncing=false;
function badgeCan(){return WEB&&STANDALONE&&('setAppBadge' in navigator)&&('Notification' in window)}
function pushCan(){return WEB&&STANDALONE&&!!PUSH_URL&&('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window)}
function avisosCan(){return badgeCan()||pushCan()}
function badgeOn(){return badgeCan()&&lsGet(LS.badge)===true&&Notification.permission==='granted'}
function dailyState(){const d=lsGet(LS.daily);return d&&typeof d==='object'?d:{on:false,hour:8}}
function dailyOn(){return pushCan()&&dailyState().on===true}
function saveDaily(patch){lsSet(LS.daily,Object.assign({},dailyState(),patch))}
function refreshSettings(){if($('#settings').classList.contains('on'))renderSettings()}
function deniedMsg(){return IS_IOS?'El iPhone bloqueó el permiso. Actívalo en Ajustes › Notificaciones › Pendientes.':'Tu dispositivo bloqueó el permiso de notificaciones. Actívalo en su configuración.'}
function syncBadge(force){
  if(!badgeCan()||S.mode!=='local')return;
  const n=badgeOn()?leftToday(allTasks(),S.today):0;
  if(!force&&n===badgeLast)return;
  badgeLast=n;
  try{const p=n?navigator.setAppBadge(n):navigator.clearAppBadge();if(p&&typeof p.catch==='function')p.catch(()=>{})}catch(e){}
}
/* copia mínima de lo pendiente para el service worker (IndexedDB 'pendientes', almacén 'kv', clave 'snapshot') */
function idbPut(key,val){
  return new Promise((res,rej)=>{
    let rq;try{rq=indexedDB.open('pendientes',1)}catch(e){rej(e);return}
    rq.onupgradeneeded=()=>{try{rq.result.createObjectStore('kv')}catch(e){}};
    rq.onerror=()=>rej(rq.error);
    rq.onsuccess=()=>{const db=rq.result;try{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(val,key);tx.oncomplete=()=>{db.close();res()};tx.onerror=tx.onabort=()=>{db.close();rej(tx.error)}}catch(e){db.close();rej(e)}};
  });
}
function syncSnapshot(force){
  if(!pushCan()||S.mode!=='local'||(!force&&!dailyOn()))return;
  const snap={v:1,badge:badgeOn(),tasks:pendingAll().map(t=>({title:t.title,due:t.due,horizon:t.horizon,kind:t.kind}))};
  const js=JSON.stringify(snap);
  if(!force&&js===snapLast)return;
  snapLast=js;clearTimeout(snapTimer);
  snapTimer=setTimeout(()=>{idbPut('snapshot',Object.assign({savedAt:new Date().toISOString()},snap)).catch(()=>{snapLast=null})},force?0:250);
}
/* suscripción push */
function b64uToU8(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function sameKey(sub,key){try{const a=new Uint8Array((sub.options&&sub.options.applicationServerKey)||[]),b=b64uToU8(key);if(a.length!==b.length)return false;for(let i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true}catch(e){return false}}
function swReady(){if(swReg)return Promise.resolve(swReg);if(!('serviceWorker' in navigator))return Promise.resolve(null);return Promise.race([navigator.serviceWorker.ready,sleep(8000).then(()=>null)]).then(r=>{if(r)swReg=r;return r},()=>null)}
async function pushApi(path,body,method){
  const ctl=typeof AbortController==='function'?new AbortController():null,t=setTimeout(()=>{if(ctl)ctl.abort()},9000);
  try{
    const r=await fetch(PUSH_URL+path,{method:method||'POST',headers:body?{'Content-Type':'text/plain'}:{},body:body?JSON.stringify(body):undefined,signal:ctl?ctl.signal:undefined,cache:'no-store'});
    let j=null;try{j=await r.json()}catch(e){}
    return {ok:r.ok,status:r.status,data:j};
  }catch(e){return {ok:false,status:0,data:null}}finally{clearTimeout(t)}
}
async function vapidKey(){
  const c=lsGet(LS.pushKey);if(typeof c==='string'&&c.length>80)return c;
  const r=await pushApi('/key',null,'GET');
  if(r.ok&&r.data&&typeof r.data.key==='string'&&r.data.key.length>80){lsSet(LS.pushKey,r.data.key);return r.data.key}
  return null;
}
function subBody(sub,hour){let tz='America/Santiago';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz}catch(e){}return {subscription:sub.toJSON(),hour:hour,tz:tz}}
async function ensureSub(reg,key){
  let sub=await reg.pushManager.getSubscription();
  if(sub&&!sameKey(sub,key)){try{await sub.unsubscribe()}catch(e){}sub=null}
  return sub||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(key)});
}
function askNotifPermission(){
  /* se llama dentro del toque: iOS solo muestra el permiso si viene de un gesto del usuario */
  return new Promise(res=>{
    let done=false;const fin=v=>{if(done)return;done=true;res(typeof v==='string'?v:Notification.permission)};
    try{const r=Notification.requestPermission(fin);if(r&&typeof r.then==='function')r.then(fin,()=>fin())}catch(e){fin()}
  });
}
function enableBadge(){
  if(!badgeCan())return;
  const after=r=>{
    if(r==='granted'){
      lsSet(LS.badge,true);lsSet(LS.avisosCard,true);syncBadge(true);
      const n=leftToday(allTasks(),S.today);
      toast(n?'Listo: el ícono muestra '+(n===1?'1 tarea':n+' tareas')+' para hoy':'Listo. Hoy no te queda nada, así que el ícono está limpio');
    }else if(r==='denied'){lsSet(LS.avisosCard,true);toast(deniedMsg())}
    render();refreshSettings();
  };
  const perm=Notification.permission;
  if(perm==='granted'){haptic();after('granted');return}
  if(perm==='denied'){after('denied');return}
  askNotifPermission().then(after);
}
function disableBadge(){haptic();lsSet(LS.badge,false);syncBadge(true);render();refreshSettings();toast('Listo, el ícono ya no muestra el número')}
function enableDaily(o){
  o=o||{};
  if(!pushCan()){enableBadge();return}
  if(S.avisosBusy)return;
  if(Notification.permission==='denied'){lsSet(LS.avisosCard,true);toast(deniedMsg());render();refreshSettings();return}
  const hour=o.hour!=null?o.hour:(dailyState().hour||8),key=lsGet(LS.pushKey);
  let p;
  if(swReg&&typeof key==='string'&&key.length>80){
    /* Apple pide llamar a subscribe de inmediato dentro del toque: esto mismo muestra el permiso */
    p=swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(key)}).then(sub=>sameKey(sub,key)?sub:ensureSub(swReg,key),err=>{
      if(Notification.permission==='granted')return ensureSub(swReg,key); /* p. ej. quedó una suscripción con otra llave */
      throw err;
    });
  }else{
    /* sin la llave del servidor a mano: primero el permiso (dentro del toque) y después la suscripción */
    p=askNotifPermission().then(r=>{
      if(r!=='granted'){const e=new Error('perm');e.perm=r;throw e}
      return Promise.all([vapidKey(),swReady()]).then(([k,reg])=>{if(!k||!reg)throw new Error('server');return ensureSub(reg,k)});
    });
  }
  S.avisosBusy=true;refreshSettings();
  p.then(async sub=>{
    const r=await pushApi('/subscribe',subBody(sub,hour));
    lsSet(LS.daily,{on:true,hour:hour,endpoint:sub.endpoint,syncedAt:r.ok?S.today:null});
    lsSet(LS.avisosCard,true);
    if(o.withBadge&&badgeCan())lsSet(LS.badge,true);
    syncBadge(true);syncSnapshot(true);
    toast(r.ok?'Listo: cada mañana a las '+hour+':00 te llega el resumen':'Quedó activado, pero falta avisarle al servidor. Se reintenta solo cuando abras la app con internet.');
  },err=>{
    const perm=Notification.permission;
    if(perm==='denied'||(err&&err.perm==='denied')){lsSet(LS.avisosCard,true);toast(deniedMsg());return}
    if(perm==='granted'&&o.withBadge&&badgeCan()){lsSet(LS.badge,true);lsSet(LS.avisosCard,true);syncBadge(true);toast('El número en el ícono quedó activo. El resumen no se pudo activar: inténtalo de nuevo en Ajustes con internet.');return}
    if(perm==='granted')toast('No se pudo activar el resumen. Revisa tu internet e intenta de nuevo.');
  }).finally(()=>{S.avisosBusy=false;render();refreshSettings()});
}
function disableDaily(){
  if(S.avisosBusy)return;
  haptic();saveDaily({on:false,syncedAt:null});
  render();refreshSettings();toast('Listo, ya no te llega el resumen');
  swReady().then(reg=>reg&&reg.pushManager.getSubscription()).then(sub=>{if(!sub)return;pushApi('/unsubscribe',{endpoint:sub.endpoint});return sub.unsubscribe()}).catch(()=>{});
}
function setDailyHour(h){
  const d=dailyState();if(!d.on||!(h>=0&&h<=23)||h===d.hour)return;
  saveDaily({hour:h,syncedAt:null});
  const offline=()=>{toast('Sin conexión: la hora se actualiza sola cuando abras la app con internet.');refreshSettings()};
  swReady().then(reg=>reg&&reg.pushManager.getSubscription()).then(sub=>{
    if(!sub){dailyResync(true);offline();return}
    return pushApi('/subscribe',subBody(sub,h)).then(r=>{if(!r.ok){offline();return}saveDaily({syncedAt:S.today,endpoint:sub.endpoint});toast('Listo: el resumen llega a las '+h+':00');refreshSettings()});
  }).catch(offline);
}
function testCooling(){return !!S.testAt&&performance.now()-S.testAt<15000}
function testDaily(){
  if(testCooling())return;
  S.testAt=performance.now();
  const btn=$('[data-act="s-daily-test"]');if(btn)btn.disabled=true;
  setTimeout(()=>{const b=$('[data-act="s-daily-test"]');if(b)b.disabled=false},15100);
  syncSnapshot(true);
  swReady().then(reg=>reg&&reg.pushManager.getSubscription()).then(sub=>{
    if(!sub){toast('Primero activa el resumen.');return}
    return pushApi('/test',subBody(sub,dailyState().hour||8)).then(r=>{
      if(r.ok){saveDaily({syncedAt:S.today,endpoint:sub.endpoint});toast('Enviado. Bloquea el teléfono: en unos segundos te llega el resumen.')}
      else toast(r.status===429?'Espera unos segundos antes de probar de nuevo.':'No se pudo enviar la prueba. Revisa tu internet.');
    });
  }).catch(()=>toast('No se pudo enviar la prueba. Revisa tu internet.'));
}
async function dailyResync(force){
  /* al abrir la app: confirma que la suscripción sigue viva y, una vez por semana o si cambió, se la recuerda al servidor */
  if(resyncing||!dailyOn()||Notification.permission!=='granted')return;
  resyncing=true;
  try{
    const d=dailyState(),reg=await swReady();if(!reg)return;
    let sub=await reg.pushManager.getSubscription();
    if(!force&&sub&&sub.endpoint===d.endpoint&&d.syncedAt&&diffDays(d.syncedAt,S.today)<7)return;
    const key=await vapidKey();if(!key)return;
    sub=await ensureSub(reg,key);
    const r=await pushApi('/subscribe',subBody(sub,d.hour||8));
    saveDaily({endpoint:sub.endpoint,syncedAt:r.ok?S.today:null});
    syncSnapshot(true);refreshSettings();
  }catch(e){}finally{resyncing=false}
}
function avisosCardHTML(){
  if(!avisosCan()||lsGet(LS.avisosCard)||dailyOn()||badgeOn()||Notification.permission==='denied')return '';
  const n=leftToday(allTasks(),S.today),push=pushCan();
  return '<aside class="install news"><span class="bdemo"><img src="icon-192.png" alt="">'+(n?'<b aria-hidden="true">'+(n>99?'99+':n)+'</b>':'')+'</span><div><h3>'+(push?'Nuevo: tu día en la pantalla bloqueada':'Nuevo: número en el ícono')+'</h3><p>'+(push?'Cada mañana a las 8:00 te llega un resumen de lo que te queda, y el ícono muestra cuántas tareas faltan. La hora se cambia en Ajustes.':'El ícono puede mostrar cuántas tareas te quedan hoy. '+cap1(DEVICE)+' lo pide como permiso de notificaciones, pero por esto no te llega ninguna.')+'</p><button type="button" class="btn small primary" data-act="avisos-on">Activar</button></div><button type="button" class="x" data-act="avisos-card-x" aria-label="Cerrar">'+icon('close')+'</button></aside>';
}
function switchHTML(act,on,title,sub){return '<button type="button" class="s-switch" role="switch" aria-checked="'+on+'" data-act="'+act+'"'+(S.avisosBusy?' aria-busy="true"':'')+'><span class="t"><b>'+title+'</b><span>'+sub+'</span></span><span class="knob" aria-hidden="true"></span></button>'}
function avisosNote(perm,dOn,bOn,d){
  if(perm==='denied')return IS_IOS?'El iPhone tiene bloqueados los avisos de Pendientes. Para activarlos: Ajustes › Notificaciones › Pendientes › Permitir notificaciones.':'Tu dispositivo bloqueó los avisos de Pendientes. Actívalos en su configuración.';
  if(dOn&&!d.syncedAt)return 'Falta confirmar el resumen con el servidor. Se reintenta solo cuando abres la app con internet.';
  if(dOn)return 'Llega todos los días a la hora elegida'+(bOn?' y también pone al día el número del ícono.':'.')+(IS_IOS?' Si no te llega, revisa en el iPhone: Ajustes › Notificaciones › Pendientes.':'');
  if(bOn)return 'El número se actualiza cada vez que usas la app.'+(IS_IOS?' Si no lo ves, revisa en el iPhone: Ajustes › Notificaciones › Pendientes › Globos.':'');
  return cap1(DEVICE)+' te va a pedir permiso de notificaciones una sola vez.';
}
function avisosSectionHTML(){
  if(!WEB)return '';
  if(!avisosCan())return (IS_IOS&&!STANDALONE)?'<section class="s-block"><h3>Avisos</h3><p class="s-p">Cuando instales Pendientes en tu pantalla de inicio podrás recibir un resumen cada mañana y ver en el ícono cuántas tareas te quedan.</p></section>':'';
  const perm=Notification.permission,d=dailyState(),dOn=dailyOn()&&perm==='granted',bOn=badgeOn();S.notifPerm=perm;
  let h='<section class="s-block"><h3>Avisos</h3><div class="s-stack">';
  if(pushCan()){
    h+=switchHTML('s-daily',dOn,'Resumen de la mañana','Una notificación con lo que te queda hoy y lo que viene.');
    if(dOn)h+='<div class="s-daily"><label class="s-hour"><span>Hora</span><select id="sDailyHour" aria-label="Hora del resumen">'+[6,7,8,9,10,11].map(x=>'<option value="'+x+'"'+(x===(d.hour||8)?' selected':'')+'>'+x+':00</option>').join('')+'</select></label><button type="button" class="btn small" data-act="s-daily-test"'+(testCooling()?' disabled':'')+'>Probar ahora</button></div>';
  }
  if(badgeCan())h+=switchHTML('s-badge',bOn,'Número en el ícono','Cuántas tareas te quedan hoy, contando las atrasadas.');
  return h+'</div><p class="s-p s-note">'+avisosNote(perm,dOn,bOn,d)+'</p></section>';
}

/* ---- inicio ---- */
document.querySelectorAll('[data-icon]').forEach(el=>el.insertAdjacentHTML('afterbegin',icon(el.dataset.icon)));
applyTheme();
const savedTab=lsGet(LS.tab);if(['hoy','semana','mes','muro'].indexOf(savedTab)>=0)S.tab=savedTab;
connect();
if(pushCan()){navigator.serviceWorker.ready.then(r=>{swReg=r}).catch(()=>{});setTimeout(()=>{if(Notification.permission!=='denied')vapidKey();dailyResync()},1500)}
})();
</script>
